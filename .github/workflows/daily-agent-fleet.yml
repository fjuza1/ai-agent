name: Daily agent fleet

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  # Pushes only run the free bug-hunter job below; the paid fleet jobs are skipped for them.
  push:
    branches: [main]

concurrency:
  group: commerce-agent-fleet-${{ github.event_name == 'push' && 'push' || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fleet:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update validated daily visual theme
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MONTHLY_BUDGET_USD: ${{ secrets.MONTHLY_BUDGET_USD || '1000' }}
          TREND_FEED_URL: ${{ vars.TREND_FEED_URL }}
        run: python agents/daily_trend_ui_agent.py --persist-reservations
      - name: Discover reviewed-product candidates
        env:
          PRODUCT_DISCOVERY_FEED_URL: ${{ vars.PRODUCT_DISCOVERY_FEED_URL }}
        run: python agents/product_expander_agent.py
      - name: Run 1000 workers with durable reservations
        id: fleet
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MONTHLY_BUDGET_USD: ${{ secrets.MONTHLY_BUDGET_USD || '1000' }}
          FLEET_SHUTDOWN_BUFFER_SECONDS: "120"
          INDEXNOW_ENABLED: ${{ vars.INDEXNOW_ENABLED || 'false' }}
          INDEXNOW_HOST: ${{ vars.INDEXNOW_HOST }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python agents/fleet_runner.py --agents 1000 --max-hours 1.5 --persist-reservations
      - name: Upload recovery evidence
        if: ${{ always() && steps.fleet.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: fleet-checkpoint-${{ github.run_id }}
          path: |
            data/agent_state.json
            data/cost_ledger.json
            data/agent_drafts.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit checkpoints and reviewed catalogs
        if: ${{ always() && steps.fleet.outcome != 'skipped' }}
        run: |
          git add data/agent_state.json data/cost_ledger.json data/agent_drafts.json data/sticker_drops.json
          if ! git diff --cached --quiet; then
            git commit -m "Save fleet checkpoints and drafts [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload visual and product draft changes
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: validated-agent-candidates-${{ github.run_id }}
          path: |
            data/daily_visual_theme.json
            data/product_candidate_drafts.json
            apps/sticker-market/public/og/daily-theme.svg
            apps/usa-christmas-supplements/public/og/daily-theme.svg
          if-no-files-found: error
          retention-days: 7
      - name: Fail after saving evidence
        if: ${{ always() }}
        env:
          FLEET_OUTCOME: ${{ steps.fleet.outcome }}
        run: test "$FLEET_OUTCOME" = success

  catalog-linker:
    # Daily rotation is free, so it still runs when the fleet job fails or stops at its budget.
    needs: fleet
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rotate daily picks and refresh discovery metadata
        id: linker
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MONTHLY_BUDGET_USD: ${{ secrets.MONTHLY_BUDGET_USD || '1000' }}
          AFFILIATE_TAG_AMAZON: ${{ vars.AFFILIATE_TAG_AMAZON }}
          ALZA_AFFILIATE_PARAM: ${{ vars.ALZA_AFFILIATE_PARAM }}
        run: python agents/daily_catalog_linker.py --persist-reservations
      - name: Commit ledger, discovery metadata and daily picks
        if: ${{ always() && steps.linker.outcome != 'skipped' }}
        run: |
          git add data/cost_ledger.json data/supplements.json data/daily_featured.json
          if ! git diff --cached --quiet; then
            git commit -m "Rotate daily picks and refresh discovery metadata [skip ci]"
            git push origin HEAD:main
          fi
      - name: Fail after saving the ledger
        if: ${{ always() }}
        env:
          LINKER_OUTCOME: ${{ steps.linker.outcome }}
        run: test "$LINKER_OUTCOME" = success

  rebuild:
    needs: [fleet, catalog-linker]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-agent-candidates-${{ github.run_id }}
          path: .
      - run: npm test
      - run: npm run test:integration -w sticker-market
      - run: npm run test:integration -w usa-christmas-supplements
      - run: npm run test:audit
      - name: Zero-mistakes type, lint, schema, build, SEO and accessibility gate
        id: verify
        run: npm run verify:zero-mistakes
        env:
          DATABASE_URL: file:./dev.db
      - name: Upload Lighthouse evidence
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/lighthouse/
          include-hidden-files: true
          if-no-files-found: error
      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit validated visual and product drafts
        run: |
          git add data/daily_visual_theme.json data/product_candidate_drafts.json apps/sticker-market/public/og/daily-theme.svg apps/usa-christmas-supplements/public/og/daily-theme.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update validated daily visual and product drafts [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-builds
          path: |
            apps/sticker-market/.next/
            apps/usa-christmas-supplements/.next/
          include-hidden-files: true

  bug-hunter:
    # Keeps BUG_REPORT.md current on every push and after the daily fleet jobs. On a schedule it waits for them so their
    # checkpoint commits land first; skipped (push) or failed fleet jobs never block it.
    needs: [fleet, catalog-linker, rebuild]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Hunt defects (incremental, SHA-256 based)
        env:
          DATABASE_URL: file:./dev.db
          # The paid LLM review runs only on the daily/manual run, never on pushes, and is budget-reserved in data/cost_ledger.json.
          LLM_API_KEY: ${{ github.event_name != 'push' && secrets.LLM_API_KEY || '' }}
          MONTHLY_BUDGET_USD: ${{ secrets.MONTHLY_BUDGET_USD || '1000' }}
          BUG_HUNTER_ARGS: ${{ github.event_name != 'push' && '--llm' || '' }}
        run: python agents/bug_hunter_agent.py $BUG_HUNTER_ARGS
      - name: Publish report summary
        if: ${{ always() }}
        run: test -f BUG_REPORT.md && head -c 60000 BUG_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit bug report, QA state and ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUG_REPORT.md data/qa_session_state.json data/cost_ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update bug report and QA session state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
